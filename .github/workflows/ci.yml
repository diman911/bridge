name: CI

# Test and package every change headed to an environment branch. Deployment is
# intentionally not performed by GitHub Actions: Cloudflare Workers Builds
# invokes scripts/deploy-ci.mjs after a push to develop or main.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage

      - name: Test in the Cloudflare Workers runtime
        run: npm run test:workers

      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      # Each package owns its TypeScript configuration. In particular the
      # Worker package includes Cloudflare runtime types that are deliberately
      # absent from the root config, so use the monorepo build rather than a
      # root-level tsc invocation.
      - name: Build and typecheck
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Exercise the exact commands configured in Workers Builds without
      # credentials or an upload. The CI-only commit SHA is absent here, so
      # the resulting metadata is tagged with "unknown", which is harmless.
      - name: Bundle check (production environment)
        run: node scripts/deploy-ci.mjs production --dry-run

      - name: Bundle check (dev environment)
        run: node scripts/deploy-ci.mjs dev --dry-run
